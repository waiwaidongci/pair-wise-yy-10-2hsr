<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>线材回潮准入与贴线复核台 · 漆线雕工坊</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
      --green: #2f7d4f;
      --slate: #5d6764;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.55; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select { font: inherit; border-radius: 6px; }
    input, select { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 36px; }
    button.secondary { background: var(--slate); }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    button.small { font-size: 12px; padding: 6px 8px; min-height: 30px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 350px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    form.formblock { display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 12px; }
    form.formblock:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
    form.formblock button { width: 100%; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(175px, 1fr)); gap: 12px; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 260px; }
    .col h3 { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .card { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; }
    .card.review { border-left-color: var(--violet); }
    .card.done { border-left-color: var(--green); }
    .card.wait { border-left-color: var(--slate); }
    .progress-track { height: 7px; background: #e3ebe7; border-radius: 4px; overflow: hidden; margin: 6px 0; }
    .progress-fill { height: 100%; background: var(--teal); }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 70px; }
    .tag { display: inline-block; font-size: 11px; border-radius: 10px; padding: 1px 8px; margin: 2px 4px 2px 0; background: #e3ebe7; color: var(--ink); }
    .tag.ok { background: #dceee2; color: var(--green); }
    .tag.hold { background: #f6e2df; color: var(--red); }
    .tag.lock { background: #f5ecd6; color: var(--amber); }
    .tag.review { background: #e6e2f2; color: var(--violet); }
    .tag.archived { background: #e7eae8; color: var(--muted); }
    .batch-row { border: 1px solid #d7e0dc; border-radius: 7px; padding: 9px; margin-bottom: 8px; background: #fbfdfb; }
    .batch-row.hold { border-left: 4px solid var(--red); }
    .batch-row.free { border-left: 4px solid var(--green); }
    .batch-row.busy { border-left: 4px solid var(--amber); }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 12px; color: var(--muted); }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(560px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 12px; }
    #toasts { position: fixed; top: 14px; right: 14px; z-index: 50; display: grid; gap: 8px; width: min(420px, calc(100vw - 28px)); }
    .toast { border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
    .toast.ok2 { background: var(--teal); }
    .toast.c409 { background: var(--red); }
    .toast.c422 { background: var(--amber); }
    .toast.c4xx { background: var(--slate); }
    .toast.info { background: var(--violet); }
    #requestLog { font-size: 12px; color: var(--muted); display: grid; gap: 4px; max-height: 200px; overflow: auto; }
    #requestLog div { border-bottom: 1px dotted #dbe3df; padding-bottom: 3px; }
    .req-ok b { color: var(--green); }
    .req-fail b { color: var(--red); }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.4; }
    details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
    @media (max-width: 1020px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .top, .summary { grid-template-columns: 1fr; }
      .board { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="toasts"></div>

  <header>
    <div>
      <h1>线材回潮准入与贴线复核台</h1>
      <div class="sub">
        漆线雕工坊 · 建档 / 领料 / 复检 / 更正版本化 ·
        含水率 &gt; 12% 或复检超 7 天只能留检 · 同批贴线未完成不得发第二件（409 不写入）
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="meta" id="clock" style="align-self:center"></span>
      <button id="refreshBtn" class="secondary">刷新核对状态</button>
      <button id="exportBtn" class="violet">导出 JSON</button>
      <button id="resetBtn" class="danger small" title="清除本地数据并恢复演示种子">重置演示数据</button>
    </div>
  </header>

  <main>
    <section class="top">
      <!-- ============ 左侧操作区 ============ -->
      <div class="panel">
        <h2>作业操作</h2>

        <form id="pieceForm" class="formblock">
          <h3>① 工件建档</h3>
          <div class="grid2">
            <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
            <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
          </div>
          <button type="submit">建档（进入待领料）</button>
        </form>

        <form id="batchForm" class="formblock">
          <h3>② 线材批次建档（回潮检测）</h3>
          <div class="grid2">
            <label>批次号<input name="batchNo" required placeholder="漆线-戊"></label>
            <label>含水率（%）<input name="moisture" type="number" step="0.1" min="0" max="100" required value="10.5"></label>
          </div>
          <label>检测日期<input name="checkedAt" type="date" required></label>
          <button type="submit">批次建档并做准入判定</button>
        </form>

        <form id="issueForm" class="formblock">
          <h3>③ 领料</h3>
          <label>工件<select name="pieceId" required></select></label>
          <label>线材批次<select name="batchId" required></select></label>
          <button type="submit">领料（重复/并发沿用首次结果）</button>
          <button type="button" id="issueConcurrentBtn" class="warn small">模拟并发双发同一领料</button>
        </form>

        <form id="recheckForm" class="formblock">
          <h3>④ 线材复检</h3>
          <div class="grid2">
            <label>批次<select name="batchId" required></select></label>
            <label>复检后含水率（%）<input name="moisture" type="number" step="0.1" min="0" max="100" required></label>
          </div>
          <label>复检日期<input name="checkedAt" type="date" required></label>
          <button type="submit">提交复检并重新判定</button>
        </form>
      </div>

      <!-- ============ 右侧核对区 ============ -->
      <div style="display:grid;gap:18px">
        <section class="panel">
          <h2>核对总览</h2>
          <div class="summary" id="summary"></div>
          <div class="board" id="board"></div>
        </section>

        <section class="panel">
          <h2>线材批次（回潮准入）</h2>
          <div id="batchList"></div>
        </section>

        <section class="panel">
          <h2>旧版留档（不进当前队列）</h2>
          <div id="archiveList"></div>
        </section>

        <section class="panel">
          <details>
            <summary>请求流水（含 409/422 判定，冲突不写入）</summary>
            <div id="requestLog" style="margin-top:8px"></div>
          </details>
        </section>
      </div>
    </section>
  </main>

  <!-- 进度 / 更正共用弹窗 -->
  <dialog id="progressDialog">
    <div class="dialog-body">
      <h2 id="progressTitle">贴线进度登记</h2>
      <div id="progressInfo" class="meta"></div>
      <label>贴线进度（%）<input id="progressInput" type="number" min="0" max="100" value="100"></label>
      <div class="actions">
        <button id="progressSave">保存进度</button>
        <button id="progressClose" class="secondary">关闭</button>
      </div>
    </div>
  </dialog>

  <dialog id="correctDialog">
    <div class="dialog-body">
      <h2>胎体 / 纹样 / 已领批次更正</h2>
      <div id="correctInfo" class="meta"></div>
      <label>胎体材质<input id="correctBase"></label>
      <label>纹样主题<input id="correctTheme"></label>
      <label>已领批次<select id="correctBatch"></select></label>
      <div class="hint">更正后：旧贴线进度立即失效，新版回到待复核；旧版留档且不进当前队列。换批须重过准入与占用校验。</div>
      <div class="actions">
        <button id="correctSave" class="violet">提交更正</button>
        <button id="correctClose" class="secondary">关闭</button>
      </div>
    </div>
  </dialog>

  <script src="rules.js"></script>
  <script src="storage.js"></script>
  <script src="page.js"></script>
</body>
</html>
