<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>线材回潮准入与贴线复核台</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .meta.log { margin-top: 6px; font-size: 12px; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select { font: inherit; border-radius: 6px; }
    input, select { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.violet { background: var(--violet); }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 330px 330px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(230px, 1fr)); gap: 12px; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 240px; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; }
    .item.blocked { border-left-color: var(--amber); background: #fffdf7; }
    .item.archived { border-left-color: var(--violet); background: #faf9fd; opacity: .92; }
    .block-reason { color: var(--amber); font-size: 12px; margin-top: 6px; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 92px; font-size: 12px; padding: 7px 8px; min-height: auto; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; vertical-align: middle; }
    .tag.held { background: #f6e6df; color: var(--red); }
    .tag.ok { background: #e2efea; color: var(--teal); }
    .bar { height: 6px; background: #e4ebe7; border-radius: 4px; margin-top: 7px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--teal); }
    .batch { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; }
    .batch.held { border-left-color: var(--red); background: #fdf8f6; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(560px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 10px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    .arch-card { border: 1px solid var(--line); border-left: 4px solid var(--violet); border-radius: 7px; padding: 9px; margin-bottom: 8px; background: #faf9fd; }
    .toast { position: fixed; right: 18px; bottom: 18px; max-width: 460px; padding: 11px 14px; border-radius: 8px; color: #fff; font-size: 13px; line-height: 1.5; opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; z-index: 9; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok { background: var(--teal); }
    .toast.fail { background: var(--amber); }
    .toast.conflict { background: var(--red); }
    .rule { font-size: 12px; color: var(--muted); background: #f5f8f6; border: 1px dashed var(--line); border-radius: 6px; padding: 8px 9px; line-height: 1.6; }
    @media (max-width: 1100px) {
      .top { grid-template-columns: 1fr; }
    }
    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .board { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>线材回潮准入与贴线复核台</h1>
      <div class="sub">建档 · 领料（回潮准入）· 复检 · 刷新核对；同一线材批次贴线未完成不得领给第二件</div>
    </div>
    <div class="actions" style="margin:0">
      <button id="refreshBtn">刷新核对状态</button>
      <button id="resetBtn" class="secondary">恢复演示数据</button>
    </div>
  </header>

  <main>
    <section class="top">
      <!-- 建档 -->
      <form id="createForm" class="panel">
        <h2>① 建档（新作品）</h2>
        <label>胎体材质<input name="base" required placeholder="脱胎漆器 / 木胎香盒"></label>
        <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        <button type="submit">建档，进入待复核</button>
        <div class="rule">建档后必须领用合格批次才能贴线；胎体、纹样或已领批次更正后，旧进度立即失效、旧版留档。</div>
      </form>

      <!-- 领料 -->
      <form id="issueForm" class="panel">
        <h2>② 领料（回潮准入）</h2>
        <label>作品<select name="pieceId" id="issuePiece" required></select></label>
        <label>线材批次<select name="batchId" id="issueBatch" required></select></label>
        <button type="submit">领料并开始贴线</button>
        <button type="button" id="repeatIssue" class="secondary">重复领用（沿用首次结果）</button>
        <button type="button" id="concurrentPair" class="danger" style="background:var(--violet)">并发演示</button>
        <div class="rule">准入线：含水率 ≤ 12% 且复检在 7 天内。超标/超期只能留检（422）；批次仍被第一件占用返回 409 且不写入。</div>
      </form>

      <!-- 线材批次 -->
      <section class="panel">
        <h2>③ 线材批次与复检</h2>
        <div id="batchList"></div>
      </section>
    </section>

    <!-- 复核看板 -->
    <section class="panel">
      <h2>贴线复核看板（当前队列）</h2>
      <div id="board" class="board"></div>
    </section>

    <!-- 旧版留档 -->
    <section class="panel">
      <h2>旧版留档（更正快照，不进当前队列）</h2>
      <div id="archiveList"></div>
    </section>
  </main>

  <!-- 更正弹窗 -->
  <dialog id="correctDialog">
    <div class="dialog-body">
      <h2 style="margin:0">更正胎体 / 纹样 / 已领批次</h2>
      <div class="grid2">
        <label>胎体材质<input id="correctBase"></label>
        <label>纹样主题<input id="correctTheme"></label>
      </div>
      <label>已领批次<select id="correctBatch"></select></label>
      <div id="correctWarn" class="rule"></div>
      <div class="actions">
        <button id="correctSubmit">提交更正</button>
        <button id="correctCancel" class="secondary">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 留档弹窗 -->
  <dialog id="historyDialog">
    <div class="dialog-body">
      <h2 id="historyTitle" style="margin:0">旧版留档</h2>
      <div id="historyContent" class="meta"></div>
      <div class="actions">
        <button id="historyClose" class="secondary">关闭</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>

  <!-- 三个业务文件：规则 / 存储 / 页面 -->
  <script src="rules.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
